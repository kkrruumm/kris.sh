{{ define "main" }}
  {{ if eq .Data.Singular "tag"}}
    <h3>Posts tagged with {{ .Title }}:</h3>
  {{ end }}
  {{ .Content }}
  {{ range .Pages }}
    <p class="postDate">{{ .Params.date.Format "Jan 2, 2006" }}</p>
    <h2 class="post"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
  {{ end }}
{{ end }}
